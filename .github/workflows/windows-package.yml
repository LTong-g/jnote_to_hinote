name: Windows package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e ".[dev,build]"
      - run: python -m pytest
      - name: Build and verify packaged PDFium
        shell: powershell
        run: |
          $env:JNOTES2HINOTE_PYTHON = (Get-Command python).Source
          ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Jnotes2Hinote-Windows
          path: dist/Jnotes2Hinote
