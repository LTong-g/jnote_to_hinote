name: Windows package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to publish as a GitHub Release (leave empty for artifact only)"
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e ".[dev,build]"
      - run: python -m pytest
      - name: Build and verify Windows package
        shell: powershell
        run: |
          $env:JNOTES2HINOTE_PYTHON = (Get-Command python).Source
          ./scripts/build_windows.ps1
      - name: Create release archive
        shell: powershell
        run: |
          $archive = "dist\Jnotes2Hinote-Windows.zip"
          Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
          Compress-Archive -LiteralPath "dist\Jnotes2Hinote" -DestinationPath $archive -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: Jnotes2Hinote-Windows
          path: dist/Jnotes2Hinote-Windows.zip
          if-no-files-found: error
      - name: Publish GitHub Release
        if: env.RELEASE_TAG != ''
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = "dist\Jnotes2Hinote-Windows.zip"
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $archive --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:RELEASE_TAG $archive --verify-tag --generate-notes --title "Jnotes2Hinote $env:RELEASE_TAG" --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish GitHub Release $env:RELEASE_TAG"
          }
